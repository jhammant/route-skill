name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same ref. Without
# this, a branch pushed three times in a minute keeps three full matrices
# running and only the last one's result is ever read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the suite reads the tree and nothing else. Fork PRs already
# get a read-only token, but stating it here means a later job added to this
# file does not silently inherit write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others — knowing it breaks on
      # 3.10 alone, versus everywhere, is the whole point of a matrix.
      fail-fast: false
      matrix:
        # The full range pyproject declares with requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # banditry is a git dependency (public, so no token is needed). Editable
      # install so the tests import the tree that was checked out.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
