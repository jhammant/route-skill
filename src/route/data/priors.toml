# Static seed rules -> Beta priors, per SPEC section 5.
#
# A pool the rules favour for a cell starts at Beta(favoured) = Beta(8, 2);
# one they don't starts at Beta(unfavoured) = Beta(2, 8). Cold start behaves
# exactly like these hand-written rules; observations swamp the prior and the
# crossover to adaptive is automatic and per-cell. There is deliberately no
# flag or threshold for "become adaptive".
#
# Rules are keyed by shape, or by "shape:tier" to override one tier of a
# shape. Tier-scoped rules win for that cell; every other tier falls back
# to the shape rule. A rule is a list of favoured arms, or a table of
# explicit per-arm Beta priors when one arm should lead and another stay
# the fallback.
#
# Changing the shape vocabulary is a SCHEMA BUMP, not a config tweak.

schema = 1
favoured = [8, 2]
unfavoured = [2, 8]

[rules]
"coding:implement" = ["claude", "codex"]
"coding:refactor"  = ["claude", "codex"]
"coding:test"      = ["codex", "kimi"]
"coding:debug"     = ["claude", "codex"]
"coding:review"    = ["kimi", "claude"]
"batch:classify"   = ["local-batch"]
"batch:summarize"  = ["local-batch"]
"batch:extract"    = ["local-batch"]
"batch:embed"      = ["local-batch"]
"research"         = ["kimi", "claude"]
"writing"          = ["claude", "kimi"]
"orchestration"    = ["claude"]

# Long-horizon coding favours Codex on GPT-6 Astra (2026-09): it leads on
# Terminal-Bench 4.0 (57.7 vs Fable 5.1 at 55.8) and keeps searchable notes
# across context windows, so it stays coherent over hours-long jobs. On
# single-shot coding it ties or trails, so the shape rules above are
# unchanged. `hard` is also where the long-horizon cue floors a task.
#
# These are explicit per-arm priors: codex leads at Beta(8, 2); claude sits
# at Beta(5, 5) — the clear fallback when codex is out of quota, still ahead
# of kimi and the local model at Beta(2, 8), and easy for evidence to move.
"coding:implement:hard"       = { codex = [8, 2], claude = [5, 5] }
"coding:implement:open-ended" = { codex = [8, 2], claude = [5, 5] }
"coding:refactor:hard"        = { codex = [8, 2], claude = [5, 5] }
"coding:refactor:open-ended"  = { codex = [8, 2], claude = [5, 5] }
"coding:debug:hard"           = { codex = [8, 2], claude = [5, 5] }
"coding:debug:open-ended"     = { codex = [8, 2], claude = [5, 5] }
"coding:test:hard"            = { codex = [8, 2], claude = [5, 5] }
"coding:test:open-ended"      = { codex = [8, 2], claude = [5, 5] }
